name: Обновить цены Каспи

on:
  schedule:
    - cron: "0 1,7,13,19 * * *"   # 4 раза в день (06:00, 12:00, 18:00, 00:00 Алматы); GitHub может задержать запуск на часы
  workflow_dispatch:         # кнопка «Run workflow» на вкладке Actions

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python prices.py
      - name: Сохранить prices.json
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "цены $(date -u +%Y-%m-%d_%H:%M)"
          git push
